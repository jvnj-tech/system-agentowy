[project]
name = "marketagents"
version = "0.1.0"
description = "System agentowy oparty na modelach językowych do automatyzacji analizy danych rynkowych"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "requests>=2.31",
    "yfinance>=0.2.50",
    "python-dotenv>=1.0",
    "langgraph>=0.6",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.1",
    "streamlit>=1.64.0",
    "plotly>=7.1.0",
    "langchain-groq>=1.1.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "ta>=0.11",
]

[project.scripts]
marketagents-fetch = "marketagents.cli:main"
marketagents-report = "marketagents.cli:report"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
